name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: asistente-3c-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node -e "JSON.parse(require('fs').readFileSync('contract/device-command-v1.json','utf8'))"
      - run: npm run lint
      - run: npm test
      - name: Verify backend mDNS discovery contract
        run: node --import tsx --test test/backendDiscovery.test.ts
      - run: npm run build
